spring:
  application:
    name: ai-agent
  profiles:
    active: local
  ai:
    dashscope:
      api-key: your-apikey
      chat:
        options:
          model: qwen-plus
#    基于pgsql的向量数据库存储
#    vectorstore:
#      pgvector:
#        index-type: HNSW
#        dimensions: 1024
#        distance-type: cosine-distance
#        max-document-batch-size: 10000
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.itheima.aiagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
server:
  port: 8123
  servlet:
    context-path: /api
# search API
search-api:
  api-key: your_api_key